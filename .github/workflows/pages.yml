name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # публикуется только основная ветка
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html config.js lms-sync.js lms-client.js lms-gs-script.js lor.css lor-ds.js demo-data.js strings.js app.js _site/
          cp -r js fonts icons _site/
          mkdir -p _site/buraq-brand/logo
          cp buraq-brand/logo/*.svg _site/buraq-brand/logo/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
