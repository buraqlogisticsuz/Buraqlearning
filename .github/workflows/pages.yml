name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# рабочий сайт — на Railway: GitHub Pages только перекидывает туда. Пусто — Pages снова выкладывает сам сайт
# (например, с сервером в Google Apps Script — адрес …/exec в config.js)
env:
  SITE_URL: https://buraqlearning-production.up.railway.app/

jobs:
  deploy:
    # публикуется только основная ветка
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Redirect to the working site
        if: env.SITE_URL != ''
        run: |
          mkdir _site
          sed "s|__SITE_URL__|$SITE_URL|g" tools/pages-redirect.html > _site/index.html
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Collect site files
        if: env.SITE_URL == ''
        run: |
          mkdir _site
          cp index.html config.js lms-sync.js lms-pay.js lms-client.js lms-gs-script.js lor.css lor-ds.js templates.js strings.js app.js _site/
          cp -r js fonts icons _site/
          mkdir -p _site/buraq-brand/logo
          cp buraq-brand/logo/*.svg _site/buraq-brand/logo/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
